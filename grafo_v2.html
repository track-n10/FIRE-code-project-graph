<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafo Interativo - O Caos, o Ritual e o Selo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #0f1015;
            color: #f0f0f0;
            font-family: "Inter", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        #header {
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 12px 20px;
            background: #151720;
            border-bottom: 1px solid #282b3a;
        }

        h1 {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            color: #00f5d4;
        }

        .header-tools {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filters {
            display: flex;
            gap: 8px 12px;
            align-items: center;
            flex-wrap: wrap;
            max-width: 860px;
            padding: 7px 12px;
            border: 1px solid #303344;
            border-radius: 8px;
            background: #171923;
            font-size: 0.72rem;
        }

        .filters label {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            cursor: pointer;
        }

        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        button {
            min-height: 31px;
            padding: 0 11px;
            border: 1px solid #35394a;
            border-radius: 6px;
            background: #202331;
            color: #fff6e8;
            font: inherit;
            font-size: 0.78rem;
            cursor: pointer;
        }

        button:hover {
            border-color: #ffaa66;
        }

        #graph-container {
            flex: 1;
            width: 100%;
            min-height: 0;
            position: relative;
            overflow: hidden;
            background: #101118;
        }

        #graph-container svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        #legend {
            position: absolute;
            right: 14px;
            bottom: 14px;
            z-index: 10;
            display: grid;
            gap: 7px;
            max-width: min(390px, calc(100vw - 28px));
            max-height: min(30vh, 250px);
            overflow: hidden;
            padding: 9px 11px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-left: 2px solid rgba(255, 170, 102, 0.72);
            border-radius: 8px;
            background: rgba(8, 9, 14, 0.68);
            backdrop-filter: blur(12px);
            font-size: 0.64rem;
            pointer-events: none;
        }

        .legend-section {
            display: flex;
            flex-wrap: wrap;
            gap: 5px 10px;
        }

        .legend-title {
            color: #ffd08a;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .legend-item {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #d9d4e3;
            white-space: nowrap;
        }

        .legend-swatch {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--swatch);
        }

        .legend-line {
            width: 16px;
            height: 0;
            border-top: 1px solid var(--swatch);
        }

        .legend-line.dashed {
            border-top-style: dashed;
        }

        .status {
            position: absolute;
            left: 14px;
            bottom: 14px;
            z-index: 10;
            max-width: min(720px, calc(100vw - 28px));
            padding: 6px 10px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            background: rgba(8, 9, 14, 0.58);
            color: #d9d4e3;
            font-size: 0.68rem;
            font-family: Consolas, "Courier New", monospace;
            pointer-events: none;
        }

        @media (max-width: 760px) {
            body {
                overflow: auto;
            }

            #header {
                align-items: flex-start;
            }

            h1 {
                font-size: 0.95rem;
            }

            .filters {
                max-width: 100%;
            }

            #legend {
                position: static;
                max-width: none;
                margin: 0;
                border-radius: 0;
            }

            .status {
                position: static;
                max-width: none;
                border-radius: 0;
            }
        }
    </style>
    <script src="https://unpkg.com/vis-network@9.1.6/dist/vis-network.min.js"></script>
</head>
<body>
<div id="header">
    <h1>Grafo da história | Caos, Ritual e Selo</h1>
    <div class="header-tools">
        <div class="filters" id="filterGroup"></div>
        <div class="controls">
            <button id="fitBtn" type="button">Centralizar</button>
            <button id="disablePhysics" type="button">Travar física</button>
            <button id="enablePhysics" type="button">Ativar física</button>
        </div>
    </div>
</div>

<div id="graph-container"></div>
<div id="legend"></div>
<div class="status" id="status">Clique em um nó para destacar suas conexões narrativas.</div>

<script>
    (function() {
        const container = document.getElementById("graph-container");
        const filterGroup = document.getElementById("filterGroup");
        const legend = document.getElementById("legend");
        const status = document.getElementById("status");
        if (!container || !filterGroup || !legend || !status) return;

        const groups = {
            identity: { label: "Julian / Kael / Silas", color: "#ff4d6d" },
            elara: { label: "Elara / Hera", color: "#00f5d4" },
            arthur: { label: "Arthur / Governo", color: "#fbb02d" },
            mara: { label: "Mara", color: "#9b5de5" },
            cult: { label: "Culto / Sistema", color: "#00bbf9" },
            ritual: { label: "Ritual", color: "#f15bb5" },
            tech: { label: "Tecnologia / Armas", color: "#fee440" },
            time: { label: "Linhas temporais", color: "#b5179e" },
            legacy: { label: "Legado / Selo", color: "#83c5be" },
            other: { label: "Outros", color: "#cccccc" }
        };

        const relationTypes = {
            identity: { label: "identidade", color: "rgba(255,77,109,0.62)", dashes: [5, 7], width: 1.35 },
            causality: { label: "causalidade", color: "rgba(210,214,235,0.28)", width: 1 },
            manipulation: { label: "manipulação", color: "rgba(155,93,229,0.52)", dashes: [4, 7], width: 1.25 },
            ritual: { label: "ritual", color: "rgba(241,91,181,0.54)", width: 1.15 },
            temporal: { label: "temporal", color: "rgba(181,23,158,0.58)", dashes: [8, 8], width: 1.35 },
            tech: { label: "tecnologia/arma", color: "rgba(254,228,64,0.55)", width: 1.15 },
            legacy: { label: "legado", color: "rgba(131,197,190,0.52)", dashes: [6, 6], width: 1.1 },
            sacrifice: { label: "sacrifício/motivação", color: "rgba(0,245,212,0.55)", width: 1.25 },
            opposition: { label: "oposição/morte", color: "rgba(239,35,60,0.62)", width: 1.45 },
            pursuit: { label: "perseguição/rastro", color: "rgba(251,176,45,0.54)", dashes: [3, 6], width: 1.05 }
        };

        const nodeDefaults = {
            identity: { shape: "dot", size: 23, borderWidth: 2 },
            elara:    { shape: "dot", size: 23, borderWidth: 2 },
            arthur:   { shape: "dot", size: 21, borderWidth: 2 },
            mara:     { shape: "dot", size: 21, borderWidth: 2 },
            cult:     { shape: "icon", size: 18, iconCode: '\uf06e' },
            ritual:   { shape: "icon", size: 18, iconCode: '\uf0d0' },
            tech:     { shape: "icon", size: 17, iconCode: '\uf531' },
            time:     { shape: "icon", size: 19, iconCode: '\uf1da' },
            legacy:   { shape: "icon", size: 18, iconCode: '\uf556' },
            other:    { shape: "dot", size: 16, borderWidth: 2 }
        };

        function node(id, label, group, title, overrides = {}) {
            const defaults = nodeDefaults[group] || nodeDefaults.other;
            const shape = overrides.shape || defaults.shape;
            const size = overrides.size || defaults.size;
            const baseColor = overrides.color || groups[group].color;

            let nodeObj = {
                id,
                label,
                group,
                type: group,
                shape: shape,
                size: size,
                title: `<div style="font-family:'Inter',sans-serif; padding:5px;"><b>${label}</b><br><span style="color:#ddd">${title}</span></div>`
            };

            if (shape === 'icon') {
                const iconCode = overrides.iconCode || defaults.iconCode || '\uf111';
                nodeObj.icon = {
                    face: "'Font Awesome 6 Free'",
                    code: iconCode,
                    weight: "900",
                    color: baseColor,
                    size: size * 1.55
                };
            } else {
                nodeObj.color = {
                    background: '#151720',
                    border: baseColor,
                    highlight: { background: baseColor, border: '#ffffff' }
                };
                nodeObj.borderWidth = overrides.borderWidth || defaults.borderWidth || 2;
            }

            return nodeObj;
        }

        const nodesData = [
            node("julian", "Julian", "identity", "Nome verdadeiro do personagem. É separado de Lorena e entregue ao circuito do governo/culto."),
            node("lorena", "Lorena", "identity", "Mãe de Julian. Sua morte é o trauma que desperta o fogo e a primeira viagem temporal.", { size: 22 }),
            node("kael_jovem", "Kael jovem", "identity", "Julian rebatizado pelo culto. Escapa da casa em chamas, infiltra-se na festa e é manipulado por Silas."),
            node("silas", "Silas / Julian adulto", "identity", "Julian/Kael adulto usando identidade de agente infiltrado no culto. Manipula eventos e deixa o plano de contingência."),

            node("elara", "Elara", "elara", "Descobre as fitas, resiste ao ritual remoto, mata Arthur, quebra o ciclo e depois assume o fardo de Mara."),
            node("hera", "Hera", "elara", "Versão velha/futura de Elara. Revela o núcleo frio e se sacrifica para empurrar Elara de volta ao laboratório."),
            node("bia", "Bia", "other", "Amiga de Elara. Encontra a primeira fita e reaparece na cena final como símbolo da normalidade protegida."),

            node("arthur", "Arthur Vane", "arthur", "Agente do governo e pai de Elara. Usa a epidemia falsa como pretexto e tenta apagar evidências biológicas."),
            node("governo", "Governo / agentes", "arthur", "Rede operacional que trafica Julian, sustenta a quarentena e aciona forças militares.", { shape: "icon", iconCode: "\uf19c" }),
            node("emma", "Emma", "arthur", "Esposa falecida de Arthur. Possível anjo/cobaia; seus objetos viram gatilhos psicológicos contra Arthur.", { size: 22 }),

            node("mara", "Mara", "mara", "Sabota rádios, usa túneis do culto, manipula Arthur e Elara, mata Silas e tenta levar Kael ao Fogo Eterno.", { shape: "icon", iconCode: "\uf21b" }),
            node("mara_proposito", "Mara com propósito", "legacy", "Identidade que Elara assume depois do selo: mito urbano e erro no sistema que caça o governo por anos.", { shape: "icon", iconCode: "\uf21b" }),

            node("culto", "Culto", "cult", "Estrutura que sequestra Julian, rebatiza-o como Kael, realiza experimentos e opera túneis, rituais e sinalizadores."),
            node("lideres_culto", "Líderes do Culto", "cult", "Alvos atraídos pela isca cronal de Elara e incinerados durante o plano de extermínio.", { shape: "icon", iconCode: "\uf0c0" }),
            node("tuneis_culto", "Túneis do Culto", "cult", "Rede subterrânea usada por Mara para se deslocar e por Kael/Silas no reencontro final.", { shape: "icon", iconCode: "\uf6fc" }),
            node("tunel_silas", "Reencontro no túnel", "cult", "Kael e Silas se encontram sob efeito das armas térmicas enquanto Mara arma a execução.", { shape: "icon", iconCode: "\uf08b" }),

            node("separacao_lorena", "Separação de Lorena", "ritual", "Julian é separado da mãe no centro de detenção e entregue aos agentes.", { shape: "icon", iconCode: "\uf127" }),
            node("experimentos", "Experimentos em Kael", "ritual", "O culto tenta despertar poderes em Julian/Kael por meio de ritual e violência.", { shape: "icon", iconCode: "\uf0c3" }),
            node("morte_lorena", "Morte de Lorena", "ritual", "Morte da mãe diante de Kael. Dispara o fogo e o primeiro salto temporal.", { shape: "icon", iconCode: "\uf714" }),
            node("omega", "Frequência Ômega", "tech", "Sabotagem de rádio de Mara que causa náuseas coletivas e pânico público.", { shape: "icon", iconCode: "\uf519" }),
            node("falsa_epidemia", "Falsa epidemia", "cult", "Narrativa pública criada pelo pânico da Frequência Ômega e usada como cobertura para a quarentena.", { shape: "icon", iconCode: "\uf0f1" }),
            node("quarentena", "Quarentena", "arthur", "Pretexto de Arthur para isolamento, cerco e controle da casa de Elara.", { shape: "icon", iconCode: "\uf071" }),
            node("predio_chips", "Prédio incendiado / chips", "mara", "Mara incendeia um prédio e deixa corpo com chips de agentes como rastro e provocação.", { shape: "icon", iconCode: "\uf1ad" }),
            node("festa_elara", "Festa de Elara", "elara", "Ambiente onde Kael observa Elara e Bia, tentando se aproximar.", { shape: "icon", iconCode: "\uf79f" }),
            node("hospital", "Hospital", "identity", "Flashback/paralelo em que Kael pesquisa rituais e recebe a visita de Silas.", { shape: "icon", iconCode: "\uf0f8" }),
            node("fita1", "Fita Lua de Mel", "ritual", "Bia encontra a fita de Arthur e Emma; Elara descobre o primeiro nível do ritual.", { shape: "icon", iconCode: "\uf4db" }),
            node("plano_vinganca", "Plano de Silas", "identity", "Silas orienta Kael a usar Elara para chegar até Arthur e admite que Mara observa tudo.", { shape: "icon", iconCode: "\uf0ca" }),
            node("estase", "Esculturas de Estase", "mara", "Mortes encenadas por Mara como paródia das fitas VHS, usando objetos de Emma para destruir Arthur.", { shape: "icon", iconCode: "\uf544" }),
            node("aviso_mara", "Aviso de Mara a Elara", "mara", "Mara antecipa que Kael se aproximará de Elara, contaminando a confiança entre eles.", { shape: "icon", iconCode: "\uf075" }),
            node("fita2", "Fita FASE 2", "ritual", "Entregue pela portinha do gato. Elara e Kael passam mal e a ruptura emocional começa.", { shape: "icon", iconCode: "\uf4db" }),
            node("ruptura", "Ruptura na festa", "elara", "Elara percebe ligação de Kael com o culto, expulsa convidados e o mantém sob mira de arma.", { shape: "icon", iconCode: "\uf127" }),
            node("video_elara", "Vídeo de Elara dormindo", "mara", "Mara grava Elara dentro da casa e envia a Arthur, provocando pânico e cerco total.", { shape: "icon", iconCode: "\uf03d" }),
            node("cerco", "Cerco militar", "arthur", "Polícia, exército, helicópteros e isolamento plástico cercam a casa como zona de contaminação.", { shape: "icon", iconCode: "\uf132" }),
            node("arma_sonica", "Arma sônica", "tech", "Líquidos tremem, luz vermelha invade a casa, todos desmaiam e a energia acaba.", { shape: "icon", iconCode: "\uf028" }),
            node("ritual_remoto", "Ritual remoto em Elara", "ritual", "Elara flutua em transe diante de feixe laranja e nomes projetados por microfones.", { shape: "icon", iconCode: "\uf028" }),
            node("quarto_panico", "Quarto do pânico / saída", "tech", "Elara lembra da possível saída subterrânea escondida na casa.", { shape: "icon", iconCode: "\uf52b" }),
            node("lab", "Laboratório subterrâneo", "cult", "Laboratório sob a casa de Elara. Ponto de controle das armas, rastreadores e bunker.", { shape: "icon", iconCode: "\uf0c3" }),
            node("armas_ads", "Armas térmicas / ADS", "tech", "Energia de calor direcionada usada no cerco, derretendo plástico e bloqueando saídas.", { shape: "icon", iconCode: "\uf76b" }),
            node("incendio_invisivel", "Incêndio invisível", "tech", "Calor letal no ar, sem chama aparente, que transforma a casa em zona de morte.", { shape: "icon", iconCode: "\uf06d" }),
            node("nucleo_frio", "Núcleo frio", "tech", "Área resfriada por nitrogênio que Hera revela ser o único refúgio seguro.", { shape: "icon", iconCode: "\uf769" }),
            node("bunker_arthur", "Bunker de Arthur", "arthur", "Câmara blindada e isolada onde Arthur assiste à limpeza militar achando-se intocável.", { shape: "icon", iconCode: "\uf132" }),
            node("morte_arthur", "Morte de Arthur", "arthur", "Elara inverte o sistema de resfriamento e redireciona o calor para a câmara de Arthur.", { shape: "icon", iconCode: "\uf714" }),
            node("morte_silas", "Morte de Silas", "mara", "Mara atira no peito de Silas diante de Kael, ativando o plano de contingência dele.", { shape: "icon", iconCode: "\uf714" }),
            node("fogo_eterno", "Fogo Eterno", "time", "Local onde Mara tenta levar Kael para apagar a existência dele e purificar a linha.", { shape: "icon", iconCode: "\uf06d" }),
            node("quebra", "Quebra do ciclo", "time", "Elara atira em Mara e depois em Kael antes da entrada no Fogo Eterno.", { shape: "icon", iconCode: "\uf127" }),

            node("primeira_viagem", "Primeira viagem temporal", "time", "Kael viaja para o passado após a morte de Lorena, tentando impedir Arthur.", { shape: "icon", iconCode: "\uf2f1" }),
            node("loop_silas", "Loop de Silas", "time", "Silas reinicia no momento da morte de Lorena após matar Arthur em outra linha.", { shape: "icon", iconCode: "\uf1da" }),
            node("casa_campo", "Casa de campo em chamas", "time", "Local recorrente onde linhas se cruzam e Silas encontra Elara/Hera saindo das chamas.", { shape: "icon", iconCode: "\uf015" }),
            node("linhas_independentes", "Linhas independentes", "time", "Regra percebida por Silas: linhas coexistem e se cruzam, sem apagar totalmente umas às outras.", { shape: "icon", iconCode: "\uf074" }),

            node("mapa_ossos", "Mapa no centro", "legacy", "Mensagem no corpo de Silas leva Elara aos códigos gravados no esqueleto.", { shape: "icon", iconCode: "\uf279" }),
            node("bio", "Bio-transmissor", "legacy", "Vértebra sintética contendo banco de dados roubado da rede mundial do culto.", { shape: "icon", iconCode: "\uf5d7" }),
            node("tv_anos90", "TV dos anos 90", "tech", "Objeto de família que vira interface para acessar a rede do culto pelo bio-transmissor.", { shape: "icon", iconCode: "\uf26c" }),
            node("isca_cronal", "Isca cronal", "legacy", "Elara hackeia sinalizadores e cria incêndios de baixa intensidade para atrair líderes do culto.", { shape: "icon", iconCode: "\uf0a1" }),
            node("selo", "Selo dimensional", "legacy", "Pulso final que estica a realidade e sela esta dimensão contra novos viajantes temporais.", { shape: "icon", iconCode: "\uf023" }),
            node("bar_final", "Bar com Bia", "other", "Anos depois, a TV está sem estática. Elara venceu e protege uma normalidade à qual não pertence mais.", { shape: "icon", iconCode: "\uf000" })
        ];

        const preferredPositions = {
            // Linha de origem, governo e quarentena.
            lorena: { x: -760, y: 240 },
            julian: { x: -560, y: 20 },
            separacao_lorena: { x: -760, y: 20 },
            governo: { x: -940, y: -80 },
            quarentena: { x: -1000, y: 120 },
            cerco: { x: -760, y: -220 },
            falsa_epidemia: { x: -980, y: 330 },
            omega: { x: -700, y: 350 },
            arma_sonica: { x: -560, y: -280 },

            // Arthur, Mara e a zona de chantagem.
            arthur: { x: -440, y: 115 },
            emma: { x: -560, y: 300 },
            predio_chips: { x: -500, y: -80 },
            estase: { x: -380, y: 335 },
            video_elara: { x: -220, y: 345 },
            bunker_arthur: { x: -105, y: 120 },
            mara: { x: -130, y: -25 },
            aviso_mara: { x: -270, y: -195 },
            mara_proposito: { x: -900, y: -360 },
            bar_final: { x: -650, y: -450 },

            // Núcleo Julian/Kael/Silas/Culto.
            culto: { x: -280, y: 80 },
            kael_jovem: { x: 95, y: -180 },
            silas: { x: 100, y: 70 },
            plano_vinganca: { x: -95, y: -95 },
            hospital: { x: 360, y: -70 },
            experimentos: { x: -330, y: -285 },
            morte_lorena: { x: -260, y: 505 },
            primeira_viagem: { x: 295, y: 505 },
            loop_silas: { x: 410, y: 330 },
            casa_campo: { x: 520, y: 150 },
            linhas_independentes: { x: 610, y: 325 },
            fogo_eterno: { x: 335, y: 165 },
            quebra: { x: 205, y: 50 },
            morte_silas: { x: 140, y: 225 },

            // Elara, festa e fitas.
            elara: { x: 160, y: -335 },
            bia: { x: -440, y: -470 },
            fita1: { x: -155, y: -505 },
            fita2: { x: 100, y: -505 },
            festa_elara: { x: 360, y: -455 },
            ritual_remoto: { x: -165, y: -350 },
            lideres_culto: { x: 5, y: -365 },
            ruptura: { x: 445, y: -330 },
            tuneis_culto: { x: -455, y: -175 },
            tunel_silas: { x: 405, y: 40 },

            // Laboratório, tecnologia e resolução.
            quarto_panico: { x: 575, y: -330 },
            lab: { x: 560, y: -145 },
            armas_ads: { x: 700, y: 120 },
            incendio_invisivel: { x: 880, y: -30 },
            nucleo_frio: { x: 920, y: -260 },
            hera: { x: 700, y: -35 },
            morte_arthur: { x: 245, y: -60 },

            // Legado e selo final.
            mapa_ossos: { x: 120, y: 495 },
            bio: { x: 5, y: 280 },
            tv_anos90: { x: -385, y: 505 },
            isca_cronal: { x: -30, y: -455 },
            selo: { x: -360, y: -390 }
        };

        nodesData.forEach(item => {
            const position = preferredPositions[item.id];
            if (!position) return;
            item.x = position.x;
            item.y = position.y;
        });

        let edgeSeq = 0;
        function edge(from, to, label, relation, overrides = {}) {
            const style = relationTypes[relation] || relationTypes.causality;
            return {
                id: `edge_${++edgeSeq}`,
                from,
                to,
                label: overrides.showLabel ? label : "",
                title: label,
                relation,
                arrows: overrides.arrows || "to",
                color: overrides.color || { color: style.color, highlight: "#ffd08a" },

        const missingNodeIds = new Set();
        const nodeIds = new Set(nodesData.map(item => item.id));
        edgesData.forEach(item => {
            if (!nodeIds.has(item.from)) missingNodeIds.add(item.from);
            if (!nodeIds.has(item.to)) missingNodeIds.add(item.to);
        });
        if (missingNodeIds.size > 0) {
            console.warn("Nós ausentes no grafo:", Array.from(missingNodeIds));
        }

        function renderFilters() {
            filterGroup.innerHTML = Object.entries(groups).map(([id, group]) => `
                <label><input type="checkbox" value="${id}" checked> ${group.label}</label>
            `).join("");
        }

        function renderLegend() {
            const nodeLegend = Object.values(groups).map(group => `
                <span class="legend-item"><span class="legend-swatch" style="--swatch:${group.color}"></span>${group.label}</span>
            `).join("");

            const edgeLegend = Object.values(relationTypes).map(type => `
                <span class="legend-item"><span class="legend-line ${type.dashes ? "dashed" : ""}" style="--swatch:${type.color}"></span>${type.label}</span>
            `).join("");

            legend.innerHTML = `
                <div class="legend-title">Nós</div>
                <div class="legend-section">${nodeLegend}</div>
                <div class="legend-title">Conexões</div>
                <div class="legend-section">${edgeLegend}</div>
            `;
        }

        renderFilters();
        renderLegend();

        function edgeColorForFallback(item) {
            if (typeof item.color === "string") return item.color;
            if (item.color && item.color.color) return item.color.color;
            const style = relationTypes[item.relation] || relationTypes.causality;
            return style.color;
        }

        function renderFallbackGraph(reason) {
            const width = 1800;
            const height = 1080;
            const cx = width / 2;
            const cy = height / 2;
            const radius = 470;
            const activeGroups = new Set(
                Array.from(document.querySelectorAll("#filterGroup input"))
                    .filter(cb => cb.checked)
                    .map(cb => cb.value)
            );
            const visibleNodes = nodesData.filter(item => activeGroups.has(item.group));
            const visibleIds = new Set(visibleNodes.map(item => item.id));
            const visibleEdges = edgesData.filter(item => visibleIds.has(item.from) && visibleIds.has(item.to));

            const positions = {};
            visibleNodes.forEach((item, index) => {
                const preferred = preferredPositions[item.id];
                if (preferred) {
                    positions[item.id] = {
                        x: cx + preferred.x * 0.74,
                        y: cy + preferred.y * 0.76
                    };
                    return;
                }
                const angle = (Math.PI * 2 * index / Math.max(visibleNodes.length, 1)) - Math.PI / 2;
                positions[item.id] = {
                    x: cx + Math.cos(angle) * radius,
                    y: cy + Math.sin(angle) * radius
                };
            });

            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
            svg.setAttribute("role", "img");
            svg.setAttribute("aria-label", "Grafo da história");

            const defs = document.createElementNS(svgNS, "defs");
            const marker = document.createElementNS(svgNS, "marker");
            marker.setAttribute("id", "fallback-arrow");
            marker.setAttribute("viewBox", "0 0 10 10");
            marker.setAttribute("refX", "9");
            marker.setAttribute("refY", "5");
            marker.setAttribute("markerWidth", "6");
            marker.setAttribute("markerHeight", "6");
            marker.setAttribute("orient", "auto-start-reverse");
            const arrow = document.createElementNS(svgNS, "path");
            arrow.setAttribute("d", "M 0 0 L 10 5 L 0 10 z");
            arrow.setAttribute("fill", "#d8d8ff");
            marker.appendChild(arrow);
            defs.appendChild(marker);
            svg.appendChild(defs);

            const message = document.createElementNS(svgNS, "text");
            message.setAttribute("x", "26");
            message.setAttribute("y", "36");
            message.setAttribute("fill", "#ffcc88");
            message.setAttribute("font-size", "17");
            message.setAttribute("font-family", "Segoe UI, Arial, sans-serif");
            message.textContent = reason || "Modo fallback: biblioteca vis-network não carregou.";
            svg.appendChild(message);

            visibleEdges.forEach(item => {
                const from = positions[item.from];
                const to = positions[item.to];
                if (!from || !to) return;

                const line = document.createElementNS(svgNS, "line");
                line.setAttribute("x1", from.x);
                line.setAttribute("y1", from.y);
                line.setAttribute("x2", to.x);
                line.setAttribute("y2", to.y);
                line.setAttribute("stroke", edgeColorForFallback(item));
                line.setAttribute("stroke-width", item.width || "1");
                line.setAttribute("stroke-opacity", "0.42");
                if (item.dashes) line.setAttribute("stroke-dasharray", Array.isArray(item.dashes) ? item.dashes.join(" ") : "7 7");
                line.setAttribute("marker-end", "url(#fallback-arrow)");
                svg.appendChild(line);
            });

            visibleNodes.forEach(item => {
                const pos = positions[item.id];
                const group = document.createElementNS(svgNS, "g");
                group.setAttribute("tabindex", "0");
                group.style.cursor = "pointer";

                let shape;
                if (item.shape === "box") {
                    shape = document.createElementNS(svgNS, "rect");
                    shape.setAttribute("x", pos.x - 54);
                    shape.setAttribute("y", pos.y - 28);
                    shape.setAttribute("width", "108");
                    shape.setAttribute("height", "56");
                    shape.setAttribute("rx", "7");
                } else if (item.shape === "diamond") {
                    shape = document.createElementNS(svgNS, "path");
                    shape.setAttribute("d", `M ${pos.x} ${pos.y - 42} L ${pos.x + 56} ${pos.y} L ${pos.x} ${pos.y + 42} L ${pos.x - 56} ${pos.y} Z`);
                } else if (item.shape === "triangle") {
                    shape = document.createElementNS(svgNS, "path");
                    shape.setAttribute("d", `M ${pos.x} ${pos.y - 44} L ${pos.x + 48} ${pos.y + 38} L ${pos.x - 48} ${pos.y + 38} Z`);
                } else if (item.shape === "star") {
                    shape = document.createElementNS(svgNS, "circle");
                    shape.setAttribute("cx", pos.x);
                    shape.setAttribute("cy", pos.y);
                    shape.setAttribute("r", item.size || 28);
                } else {
                    shape = document.createElementNS(svgNS, "circle");
                    shape.setAttribute("cx", pos.x);
                    shape.setAttribute("cy", pos.y);
                    shape.setAttribute("r", item.size || 24);
                }

                const fallbackFill = item.color && typeof item.color === "object"
                    ? item.color.background || groups[item.group].color
                    : item.color || groups[item.group].color;
                shape.setAttribute("fill", fallbackFill);
                shape.setAttribute("stroke", "rgba(255,255,255,0.8)");
                shape.setAttribute("stroke-width", "1");
                shape.setAttribute("opacity", "0.9");
                group.appendChild(shape);

                const title = document.createElementNS(svgNS, "title");
                title.textContent = item.title.replace(/<br>/g, " - ").replace(/<[^>]*>/g, "");
                group.appendChild(title);

                const text = document.createElementNS(svgNS, "text");
                text.setAttribute("x", pos.x);
                text.setAttribute("y", pos.y + 48);
                text.setAttribute("text-anchor", "middle");
                text.setAttribute("fill", "#ffffff");
                text.setAttribute("font-size", "11");
                text.setAttribute("font-family", "Segoe UI, Arial, sans-serif");
                text.textContent = item.label;
                group.appendChild(text);

                group.addEventListener("click", () => {
                    status.textContent = `${item.label}: ${title.textContent.substring(0, 150)}`;
                });

                svg.appendChild(group);
            });

            container.innerHTML = "";
            container.appendChild(svg);
            status.textContent = "Grafo exibido em modo fallback. A versão interativa completa precisa carregar a biblioteca vis-network.";
        }

        if (!window.vis || !window.vis.Network || !window.vis.DataSet) {
            renderFallbackGraph("Biblioteca vis-network não carregou. Verifique a conexão com unpkg.com ou use o fallback abaixo.");
            document.querySelectorAll("#filterGroup input").forEach(cb => cb.addEventListener("change", () => renderFallbackGraph()));
            return;
        }

        const nodes = new vis.DataSet(nodesData);
        const edges = new vis.DataSet(edgesData);

        const options = {
            nodes: {
                font: {
                    size: 10,
                    color: "rgba(255,255,255,0.88)",
                    face: "Inter, 'Segoe UI', sans-serif",
                    strokeWidth: 3,
                    strokeColor: "rgba(12,13,19,0.86)"
                },
                borderWidth: 2,
                shadow: { enabled: true, color: "rgba(0,0,0,0.38)", size: 5, x: 0, y: 2 },
                margin: 5
            },
            edges: {
                arrows: { to: { enabled: true, scaleFactor: 0.42 } },
                smooth: { type: "dynamic", roundness: 0.14 },
                font: { size: 0, color: "rgba(255,255,255,0)", strokeWidth: 0, face: "Inter, sans-serif" },
                color: { color: "rgba(180, 185, 215, 0.24)", highlight: "#ffd08a", hover: "#ffffff" },
                hoverWidth: 0.25,
                selectionWidth: 1.4,
                shadow: false
            },
            physics: {
                enabled: false,
                stabilization: { iterations: 260, fit: true },
                solver: "forceAtlas2Based",
                forceAtlas2Based: {
                    gravitationalConstant: -155,
                    centralGravity: 0.006,
                    springLength: 250,
                    springConstant: 0.035,
                    damping: 0.58,
                    avoidOverlap: 1
                },
                minVelocity: 0.55
            },
            interaction: {
                hover: true,
                tooltipDelay: 100,
                zoomView: true,
                dragView: true,
                multiselect: false,
                navigationButtons: false
            },
            layout: { randomSeed: 42, improvedLayout: false }
        };

        let network;
        try {
            network = new vis.Network(container, { nodes, edges }, options);
            console.log("Grafo v2 inicializado com conexões detalhadas.");
        } catch(err) {
            console.error(err);
            renderFallbackGraph("Erro ao criar grafo interativo. Usando visualização fallback.");
            return;
        }

        network.once("stabilizationIterationsDone", () => {
            network.setOptions({ physics: false });
            network.fit({ animation: true });
            status.textContent = "Grafo pronto. Clique em um nó para destacar identidade, causa, ritual, tempo, tecnologia e legado.";
        });
        setTimeout(() => {
            network.setOptions({ physics: false });
            network.fit({ animation: true });
            status.textContent = "Grafo pronto. Clique em um nó para destacar identidade, causa, ritual, tempo, tecnologia e legado.";
        }, 1200);

        let originalNodeColors = {};
        let originalEdgeColors = {};
        let originalEdgeWidths = {};

        function cacheOriginalColors() {
            if (Object.keys(originalNodeColors).length > 0) return;
            nodes.forEach(item => { originalNodeColors[item.id] = item.color; });
            edges.forEach(item => {
                originalEdgeColors[item.id] = item.color && typeof item.color === "object"
                    ? { ...item.color }
                    : item.color;
                originalEdgeWidths[item.id] = item.width;
            });
        }

        function restoreColors() {
            cacheOriginalColors();
            nodes.update(Object.keys(originalNodeColors).map(id => ({
                id,
                color: originalNodeColors[id],
                opacity: 1,
                font: { color: "#ffffff" }
            })));
            edges.update(Object.keys(originalEdgeColors).map(id => ({
                id,
                color: originalEdgeColors[id],
                width: originalEdgeWidths[id],
                opacity: 1
            })));
        }

        network.on("click", function(params) {
            cacheOriginalColors();

            if (params.nodes.length === 0) {
                restoreColors();
                status.textContent = "Clique em um nó para destacar suas conexões narrativas.";
                return;
            }

            const clickedNodeId = params.nodes[0];
            const clickedNode = nodes.get(clickedNodeId);
            const connectedEdges = network.getConnectedEdges(clickedNodeId);
            const connectedNodes = network.getConnectedNodes(clickedNodeId);
            const plainTitle = clickedNode.title.replace(/<br>/g, " - ").replace(/<[^>]*>/g, "");

            const allNodes = nodes.get();
            const allEdges = edges.get();

            const updatedNodes = allNodes.map(n => {
                if (n.id === clickedNodeId) {
                    return { id: n.id, opacity: 1, font: { color: "#ffffff" } };
                } else if (connectedNodes.includes(n.id)) {
                    return { id: n.id, opacity: 1, font: { color: "#eeeeee" } };
                } else {
                    return { id: n.id, opacity: 0.15, font: { color: "rgba(255,255,255,0.1)" } };
                }
            });

            const updatedEdges = allEdges.map(e => {
                if (connectedEdges.includes(e.id)) {
                    return { id: e.id, opacity: 1, color: { color: "#ffffff", highlight: "#ffffff" }, width: 2.1 };
                } else {
                    return { id: e.id, opacity: 0.035 };
                }
            });

            nodes.update(updatedNodes);
            edges.update(updatedEdges);

            status.textContent = `${clickedNode.label}: ${plainTitle.substring(0, 180)}`;
        });

        const checkboxes = document.querySelectorAll("#filterGroup input");
        function applyFilter() {
            const activeGroups = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);
            const activeSet = new Set(activeGroups);
            const visibleIds = new Set();
            const updatedNodes = nodesData.map(item => {
                const visible = activeSet.has(item.group);
                if (visible) visibleIds.add(item.id);
                return { id: item.id, hidden: !visible };
            });

            const updatedEdges = edgesData.map(item => ({
                id: item.id,
                hidden: !(visibleIds.has(item.from) && visibleIds.has(item.to))
            }));

            nodes.update(updatedNodes);
            edges.update(updatedEdges);
            restoreColors();
            network.fit({ animation: true });
        }

        checkboxes.forEach(cb => cb.addEventListener("change", applyFilter));

        document.getElementById("fitBtn").onclick = () => network.fit({ animation: true });
        document.getElementById("disablePhysics").onclick = () => network.setOptions({ physics: false });
        document.getElementById("enablePhysics").onclick = () => network.setOptions({ physics: true });
        window.addEventListener("resize", () => network.fit());
    })();
